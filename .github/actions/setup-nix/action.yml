name: Setup Nix
description: Install Nix and tooling with the configured signed binary cache

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: |
          accept-flake-config = true
          extra-substituters = https://cache.eidetica.dev
          extra-trusted-public-keys = cache.eidetica.dev-1:eND5gRJlbnool3ZLCWT2H8kkygWS8JcsU76HYXbWPBI=

    # `--inputs-from .` resolves `nixpkgs` to this repo's locked nixpkgs input, so
    # CI runs the same nix-fast-build and nix-eval-jobs as the dev shell. Without
    # it, `nixpkgs#` comes from the installer's rolling registry and the tooling
    # changes underneath CI with no commit here.
    - name: Install nix-fast-build
      shell: bash
      run: nix profile install --inputs-from . nixpkgs#nix-fast-build
