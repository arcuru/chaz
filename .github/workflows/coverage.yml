name: Coverage

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    # Scheduled workflow that reads CODECOV_TOKEN: forks don't run it.
    if: github.repository_owner == 'arcuru'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build coverage
        run: |
          nix-fast-build --no-nom --no-link \
            -f '.#legacyPackages.x86_64-linux.coverage.default'

      - name: Extract coverage data
        run: |
          mkdir -p coverage
          cp "$(nix build --no-link --print-out-paths '.#legacyPackages.x86_64-linux.coverage.default')/lcov.info" coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
