name: Coverage

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubicloud-standard-8
    # Scheduled workflow that reads CODECOV_TOKEN: forks don't run it.
    if: github.repository_owner == 'arcuru'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build coverage
        run: |
          nix-fast-build --no-nom --no-link \
            -f '.#legacyPackages.x86_64-linux.coverage.default'

      - name: Extract coverage data
        run: |
          mkdir -p coverage
          cp "$(nix build --no-link --print-out-paths '.#legacyPackages.x86_64-linux.coverage.default')/lcov.info" coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
