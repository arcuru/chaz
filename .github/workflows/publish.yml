# Publish workflow — pushes built artifacts to the eidetica Nix cache.
#
# Triggers after every successful CI run on main. Builds clean from
# cache.nixos.org (bypassing our own cache to prevent poisoning), signs
# the results, and pushes them to s3://cache-eidetica-dev. Subsequent
# CI runs and local builds then download instead of recompiling.
#
# Dev publishes after main CI are coalesced: one runs, at most one waits, and
# a newer arrival replaces the waiting one. A running publish is never
# cancelled. The guard job then builds the newest CI-verified main commit, so
# an older CI run that finishes late cannot overwrite newer output. Manual
# dispatch publishes main as before, outside that queue.

name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Only a trusted dev publish joins the shared group; anything else (a failed
# or untrusted CI run, a manual dispatch) gets its own group. A skipped run in
# the shared group would replace a real waiting publish.
concurrency:
  group: >-
    ${{ (github.repository_owner == 'arcuru' &&
         github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
         github.event.workflow_run.head_repository.full_name == github.repository)
        && 'publish-dev' || format('publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Picks the commit a dev publish builds. Holds no secret: it reads the
  # Actions API and main's history, and its answer is a CI-verified SHA.
  guard:
    name: Select dev revision
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    # A fork PR can also use a branch named main. Check the triggering event
    # and source repository before any commit is checked out with publish
    # secrets; the guard re-checks the same through the API.
    if: |
      github.repository_owner == 'arcuru' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      # Read-only: confirms the triggering CI run and finds newer green runs.
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select revision
        id: select
        run: python3 .github/scripts/publish_guard.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  push-cache:
    name: Push to cache
    needs: guard
    environment: publish
    runs-on: ubicloud-standard-8
    timeout-minutes: 60
    # Dev publishes run only on the guard's verdict, which exists only for a
    # trusted CI run; manual dispatch keeps its main-only check.
    if: |
      !cancelled() &&
      github.repository_owner == 'arcuru' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        needs.guard.result == 'success' &&
        needs.guard.outputs.publish == 'true' &&
        needs.guard.outputs.sha != ''))
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.guard.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        id: nix
        with:
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      # Build the binary clean from source, bypassing our own cache to
      # prevent cache poisoning from affecting published artifacts.
      - name: Build and push artifacts
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            ${{ steps.nix.outputs.push-args }} \
            --option substituters 'https://cache.nixos.org' \
            -f '.#packages.x86_64-linux.default'

      # Warm the cache with all check outputs (lint, test, doc, build) so
      # subsequent CI runs and dev shells download instead of recompiling.
      - name: Warm CI cache
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            ${{ steps.nix.outputs.push-args }}
