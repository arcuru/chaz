# Publish workflow — pushes built artifacts to the eidetica Nix cache.
#
# Called after all main CI jobs succeed, within CI's native concurrency group.
# Manual runs enter through CI so both platforms must pass. Builds from cache.nixos.org
# (bypassing our own cache to prevent poisoning), signs the results, and pushes
# them to s3://cache-eidetica-dev. No PR artifacts enter the publisher.

name: Publish

on:
  workflow_call:
    secrets:
      NIX_CACHE_ACCESS_KEY_ID:
        required: true
      NIX_CACHE_SECRET_ACCESS_KEY:
        required: true
      NIX_CACHE_SIGNING_KEY:
        required: true

permissions:
  contents: read

jobs:
  push-cache:
    name: Push to cache
    environment: publish
    runs-on: ubicloud-standard-8
    timeout-minutes: 60
    # Reusable workflows retain the caller's event/ref. PR and nonmain calls
    # cannot enter the protected publishing environment.
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        id: nix
        with:
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      # Build clean from source, bypassing our cache. push-args comes from our
      # checked-out setup action and carries pre-quoted store flags; shell env
      # expansion would not re-parse those quotes, so it must expand inline.
      - name: Build and push artifacts
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            ${{ steps.nix.outputs.push-args }} \
            --option substituters 'https://cache.nixos.org' \
            -f '.#packages.x86_64-linux.default'

      # Publish check results and their reusable test outputs explicitly: the
      # successful test check is only a marker and does not retain its inputs.
      - name: Warm CI cache
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            ${{ steps.nix.outputs.push-args }}
          nix-fast-build --skip-cached --no-nom --no-link \
            ${{ steps.nix.outputs.push-args }} \
            -f '.#legacyPackages.x86_64-linux.test'
