# Required status check that blocks merging dependency-update PRs during their
# hold period: passes immediately for non-deps/ branches and fails while the PR
# still carries the "on-hold" label. Delegates to the arcuru/actions reusable
# workflow.
name: "Deps: Hold Gate"

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Required checks must also report on a merge group or the queue stalls. The
  # gate passes there on its own: a merge group has no head_ref, so the
  # ^deps/ test in the reusable workflow exits early. The hold gates entry
  # into the queue, not the queue itself.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  hold:
    uses: arcuru/actions/.github/workflows/dependency-hold.yml@66448a5bf7ed8885a63470ca9b212a0f2dd83d90 # v0.4.1
    with:
      runs-on: ubicloud-standard-2
