name: Matrix E2E

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Finish the running main E2E and keep one replaceable pending run. Other manual
# branches stay independent; this queue never blocks ordinary CI or publishing.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'matrix-e2e-main' ||
        format('matrix-e2e-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Needs no secrets: the homeserver, accounts and model are disposable and local
  # to the runner. This workflow can be disabled independently of ordinary CI.
  e2e:
    name: Matrix E2E
    runs-on: ubicloud-standard-8
    # Full coverage runs on main pushes or a manually selected branch, not on
    # PRs/merge groups. The custom runner only exists in the upstream repository.
    if: |
      github.repository_owner == 'arcuru' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # The two steps below budget 30 minutes between them. The rest is headroom
    # for the checkout, the nix installer, and pulling the Synapse closure.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # rust-cache must inspect the same compiler that nix develop uses, not
      # the runner's preinstalled Rust. Only expose that toolchain's bin path.
      - name: Expose Nix Rust toolchain
        run: |
          nix develop .# --command sh <<'SH'
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
          SH

      # Keep this dependency/target cache separate from release jobs, and
      # invalidate even restore prefixes when the Nix environment changes.
      # GitHub's normal branch/PR cache scope still applies; no Nix store paths.
      - name: Cache E2E dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: matrix-e2e-${{ hashFiles('flake.nix', 'flake.lock') }}
          cache-bin: false

      # Debug binaries, matching what `just e2e` builds locally. Split from the
      # harness step so a slow cold compile does not eat the harness budget.
      - name: Build binaries
        run: |
          nix develop .# --command cargo build --bin chaz --bin chaz-matrix --example e2ee_probe
        timeout-minutes: 20

      # Keep the existing harness deadline as a backstop for setup or a component
      # that stops making progress. Keep the disposable workspace outside
      # Nix's temporary shell directory so failed/timed-out runs can be inspected.
      # Exit 2 means the harness never got far enough to test anything — a
      # missing binary, a tool absent from the shell, a homeserver that would
      # not start. That is a different problem from a failing assertion, and
      # the job UI shows both as a red X, so say which one it was.
      - name: Matrix E2E
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-e2e"
          set +e
          nix develop .#e2e --command env TMPDIR="$RUNNER_TEMP/matrix-e2e" \
            dev/matrix-e2e/run.sh --keep --verbose 2>&1 | tee "$RUNNER_TEMP/matrix-e2e/harness.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            echo "::error::harness could not start (exit 2) — see the log above"
          fi
          exit "$rc"
        timeout-minutes: 10

      # Only this run's fixture logs and Eidetica databases (including SQLite
      # sidecars). Never upload configs, Matrix sessions/crypto stores, Synapse
      # databases/keys, or share tickets. No production state enters this job.
      - name: Retain failed Matrix diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matrix-e2e-diagnostics
          retention-days: 7
          path: |
            ${{ runner.temp }}/matrix-e2e/harness.log
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/*.log
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/synapse/homeserver.log*
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-daemon/eidetica.db
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-daemon/eidetica.db-wal
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-daemon/eidetica.db-shm
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-bridge/eidetica.db
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-bridge/eidetica.db-wal
            ${{ runner.temp }}/matrix-e2e/chaz-matrix-e2e-*/state-bridge/eidetica.db-shm
