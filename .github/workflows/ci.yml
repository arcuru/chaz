name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A merge queue runs its checks against a synthetic branch and reports them
  # under this event. A required check that does not subscribe to it never
  # reports at all, which stalls the queue rather than failing it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Queue main CI and its dependent publisher together: finish the running pipeline
# and keep one replaceable pending pipeline. PRs only supersede their own checks;
# other branches and merge-queue runs cannot displace main.
concurrency:
  group: >-
    ${{ github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        'ci-dev-main' ||
        format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Lint
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.lint'
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.treefmt'
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.ci-policy'

      - name: Test
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.test'

      # PRs retain normal Cargo tests (including doctests), lint and build.
      - name: Doc
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.doc'

      - name: Build
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.build'

  # The Matrix bridge end-to-end test. Separate from the checks above because it
  # pulls Synapse into the closure and stands up four processes, neither of which
  # the fast checks should wait on. Needs no secrets — the homeserver, the
  # accounts, and the model are all throwaway and local to the runner.
  e2e:
    name: Matrix E2E
    runs-on: ubicloud-standard-8
    # Full coverage runs on main pushes or a manually selected branch, not on
    # PRs/merge groups. The custom runner only exists in the upstream repository.
    if: |
      github.repository_owner == 'arcuru' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # The two steps below budget 30 minutes between them. The rest is headroom
    # for the checkout, the nix installer, and pulling the Synapse closure.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # rust-cache must inspect the same compiler that nix develop uses, not
      # the runner's preinstalled Rust. Only expose that toolchain's bin path.
      - name: Expose Nix Rust toolchain
        run: |
          nix develop .# --command sh <<'SH'
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
          SH

      # Keep this dependency/target cache separate from release jobs, and
      # invalidate even restore prefixes when the Nix environment changes.
      # GitHub's normal branch/PR cache scope still applies; no Nix store paths.
      - name: Cache E2E dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: matrix-e2e-${{ hashFiles('flake.nix', 'flake.lock') }}
          cache-bin: false

      # Debug binaries, matching what `just e2e` builds locally. Split from the
      # harness step so a slow cold compile does not eat the harness budget.
      - name: Build binaries
        run: |
          nix develop .# --command cargo build --bin chaz --bin chaz-matrix --example e2ee_probe
        timeout-minutes: 20

      # Every wait inside run.sh is bounded, so a passing run finishes in about a
      # minute. This ceiling is the backstop for a Synapse that comes up wedged
      # and never satisfies any of them. `--verbose` streams the component logs
      # into the job output, because the harness deletes its workspace on exit
      # and there is nothing to collect afterwards.
      # Exit 2 means the harness never got far enough to test anything — a
      # missing binary, a tool absent from the shell, a homeserver that would
      # not start. That is a different problem from a failing assertion, and
      # the job UI shows both as a red X, so say which one it was.
      - name: Matrix E2E
        run: |
          set +e
          nix develop .#e2e --command dev/matrix-e2e/run.sh --verbose
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::harness could not start (exit 2) — see the log above"
          fi
          exit "$rc"
        timeout-minutes: 10

  publish:
    name: Publish
    needs: [ci, e2e]
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    # Reusable workflows require the names even for environment-scoped secrets;
    # their values are resolved in the callee's protected publishing job.
    secrets:
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
