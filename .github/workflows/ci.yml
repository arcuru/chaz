name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A merge queue runs its checks against a synthetic branch and reports them
  # under this event. A required check that does not subscribe to it never
  # reports at all, which stalls the queue rather than failing it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Queue main CI and its dependent publisher together: finish the running pipeline
# and keep one replaceable pending pipeline. PRs only supersede their own checks;
# other branches and merge-queue runs cannot displace main.
concurrency:
  group: >-
    ${{ github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        'ci-dev-main' ||
        format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # One graph shares dependency work and lets independent checks overlap.
      # Allow two builds at once, each using all cores so a dependency build
      # running alone can use the whole runner.
      - name: Checks
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          checks=(
            '.#checks.x86_64-linux.lint'
            '.#checks.x86_64-linux.treefmt'
            '.#checks.x86_64-linux.ci-policy'
            '.#checks.x86_64-linux.test'
            '.#checks.x86_64-linux.build'
          )
          # PRs retain normal Cargo tests, including doctests.
          if [[ "$CI_EVENT_NAME" == push || "$CI_EVENT_NAME" == workflow_dispatch ]]; then
            checks+=('.#checks.x86_64-linux.doc')
          fi
          nix build --no-link --keep-going --max-jobs 2 --cores 0 "${checks[@]}"

  publish:
    name: Publish
    # Matrix E2E is independent and can be disabled without blocking publishing.
    needs: [ci]
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    # Reusable workflows require the names even for environment-scoped secrets;
    # their values are resolved in the callee's protected publishing job.
    secrets:
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
