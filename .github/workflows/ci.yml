name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "ci/cache-cost-trials-20261015"]
  # A merge queue runs its checks against a synthetic branch and reports them
  # under this event. A required check that does not subscribe to it never
  # reports at all, which stalls the queue rather than failing it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Only newer runs of the same PR supersede each other. Non-PR runs get unique
# groups so main, manual, and merge-queue runs never cancel or evict one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Keep the control's existing status context; alternatives are trial-only.
    name: ${{ matrix.runner == 'ubicloud-standard-8' && 'CI' || format('CI (trial {0})', matrix.runner) }}
    strategy:
      # Resource failures on one runner must not cancel the other measurements.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' &&
          github.repository == 'arcuru/chaz' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'ci/runner-comparison-20261015' &&
          github.base_ref == 'ci/cache-cost-trials-20261015' &&
          github.event.pull_request.base.sha == '654a25be1d95d471948e3cb4a85ebd3bc4faccb0' &&
          '["ubicloud-standard-8","ubicloud-standard-4","ubuntu-24.04"]' ||
          '["ubicloud-standard-8"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Stream samples during commands, even if a deadline prevents cleanup.
        # Ordinary runs keep GitHub's implicit Linux bash invocation.
        shell: ${{ github.base_ref == 'ci/cache-cost-trials-20261015' && 'python3 dev/ci-runner-trial/telemetry.py run {0}' || 'bash -e {0}' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only the stacked trial gets telemetry. Refuse an unexpected parent tip
      # or head rather than reporting a skipped, apparently green control.
      - name: Validate runner trial
        if: github.base_ref == 'ci/cache-cost-trials-20261015'
        run: python3 dev/ci-runner-trial/telemetry.py check

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Lint
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.lint'
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.treefmt'

      - name: Test
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.test'

      - name: Doc
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.doc'

      - name: Build
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#checks.x86_64-linux.build'

      - name: Runner disk footprint (logs only)
        timeout-minutes: 1
        if: always() && github.base_ref == 'ci/cache-cost-trials-20261015'
        continue-on-error: true
        run: |
          du -sk /nix/store target 2>/dev/null || true

  # The Matrix bridge end-to-end test. Separate from the checks above because it
  # pulls Synapse into the closure and stands up four processes, neither of which
  # the fast checks should wait on. Needs no secrets — the homeserver, the
  # accounts, and the model are all throwaway and local to the runner.
  e2e:
    # Keep the control's existing status context; alternatives are trial-only.
    name: ${{ matrix.runner == 'ubicloud-standard-8' && 'Matrix E2E' || format('Matrix E2E (trial {0})', matrix.runner) }}
    strategy:
      # Resource failures on one runner must not cancel the other measurements.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' &&
          github.repository == 'arcuru/chaz' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'ci/runner-comparison-20261015' &&
          github.base_ref == 'ci/cache-cost-trials-20261015' &&
          github.event.pull_request.base.sha == '654a25be1d95d471948e3cb4a85ebd3bc4faccb0' &&
          '["ubicloud-standard-8","ubicloud-standard-4","ubuntu-24.04"]' ||
          '["ubicloud-standard-8"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Stream samples during commands, even if a deadline prevents cleanup.
        # Ordinary runs keep GitHub's implicit Linux bash invocation.
        shell: ${{ github.base_ref == 'ci/cache-cost-trials-20261015' && 'python3 dev/ci-runner-trial/telemetry.py run {0}' || 'bash -e {0}' }}
    # Fenced to the upstream repository, whose runner label this is: a fork
    # running its own copy of this workflow would queue forever rather than
    # fail. A pull request from a fork still schedules the job, because the
    # check reads the owner of the base repository — which is fine, since
    # `pull_request` hands fork code a read-only token and this job reads no
    # secret.
    if: github.repository_owner == 'arcuru'
    # The two steps below budget 30 minutes between them. The rest is headroom
    # for the checkout, the nix installer, and pulling the Synapse closure.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only the stacked trial gets telemetry. Refuse an unexpected parent tip
      # or head rather than reporting a skipped, apparently green control.
      - name: Validate runner trial
        if: github.base_ref == 'ci/cache-cost-trials-20261015'
        run: python3 dev/ci-runner-trial/telemetry.py check

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # rust-cache must inspect the same compiler that nix develop uses, not
      # the runner's preinstalled Rust. Only expose that toolchain's bin path.
      - name: Expose Nix Rust toolchain
        run: |
          nix develop .# --command sh <<'SH'
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
          SH

      # Keep this dependency/target cache separate from release jobs, and
      # invalidate even restore prefixes when the Nix environment changes.
      # GitHub's normal branch/PR cache scope still applies; no Nix store paths.
      - name: Cache E2E dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: matrix-e2e-${{ hashFiles('flake.nix', 'flake.lock') }}
          # Isolate cold/warm trial arms, including fallback restore prefixes.
          # Outside this stack, use the action's unchanged default prefix.
          prefix-key: ${{ github.base_ref == 'ci/cache-cost-trials-20261015' && format('v0-rust-runner-trial-{0}', matrix.runner) || 'v0-rust' }}
          cache-bin: false

      # Debug binaries, matching what `just e2e` builds locally. Split from the
      # harness step so a slow cold compile does not eat the harness budget.
      - name: Build binaries
        run: |
          nix develop .# --command cargo build --bin chaz --bin chaz-matrix --example e2ee_probe
        timeout-minutes: 20

      # Every wait inside run.sh is bounded, so a passing run finishes in about a
      # minute. This ceiling is the backstop for a Synapse that comes up wedged
      # and never satisfies any of them. `--verbose` streams the component logs
      # into the job output, because the harness deletes its workspace on exit
      # and there is nothing to collect afterwards.
      # Exit 2 means the harness never got far enough to test anything — a
      # missing binary, a tool absent from the shell, a homeserver that would
      # not start. That is a different problem from a failing assertion, and
      # the job UI shows both as a red X, so say which one it was.
      - name: Matrix E2E
        run: |
          set +e
          nix develop .#e2e --command dev/matrix-e2e/run.sh --verbose
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::harness could not start (exit 2) — see the log above"
          fi
          exit "$rc"
        timeout-minutes: 10

      - name: Runner disk footprint (logs only)
        timeout-minutes: 1
        if: always() && github.base_ref == 'ci/cache-cost-trials-20261015'
        continue-on-error: true
        run: |
          du -sk /nix/store target 2>/dev/null || true
