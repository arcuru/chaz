name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A merge queue runs its checks against a synthetic branch and reports them
  # under this event. A required check that does not subscribe to it never
  # reports at all, which stalls the queue rather than failing it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Queue main CI and its dependent publisher together: finish the running pipeline
# and keep one replaceable pending pipeline. PRs only supersede their own checks;
# other branches and merge-queue runs cannot displace main.
concurrency:
  group: >-
    ${{ github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        'ci-dev-main' ||
        format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # Pull requests and merge-queue runs check on the native ARM64 runner. Its
    # one Nix store persists across jobs, so unchanged outputs are reused rather
    # than rebuilt or restored; its preinstalled daemon owns substituters and
    # build limits, and jobs are untrusted clients with no publishing
    # credentials. Main (push or manual) also checks ARM below, alongside
    # hosted x86_64 checks; Publish waits for both platforms.
    runs-on: >-
      ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          '"ubicloud-standard-8"' ||
          '["self-hosted", "Linux", "ARM64", "zinc", "nix"]') }}
    # The ARM runner needs room for a cold store; later runs reuse its outputs.
    timeout-minutes: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 30 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The ARM runner provides Nix; hosted runners install it fresh.
      - name: Setup Nix
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix

      # One graph shares dependency work and lets independent checks overlap.
      # Hosted main allows two builds at once, each using all cores so a
      # dependency build running alone can use the whole runner. The ARM
      # runner's Nix configuration sets concurrency for its memory instead.
      - name: Checks
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          system=aarch64-linux
          limits=()
          names=(lint treefmt ci-policy test build)
          # PRs retain normal Cargo tests, including doctests.
          if [[ "$CI_EVENT_NAME" == push || "$CI_EVENT_NAME" == workflow_dispatch ]]; then
            system=x86_64-linux
            limits=(--max-jobs 2 --cores 0)
            names+=(doc)
          fi
          checks=()
          for name in "${names[@]}"; do
            checks+=(".#checks.$system.$name")
          done
          build_status=0
          nix build -L --no-link --keep-going "${limits[@]}" "${checks[@]}" || build_status=$?
          # Report even after failure or a cache hit. Reading a stored log does
          # not rerun a check, and unavailable logs do not change build status.
          for name in "${names[@]}"; do
            log=".#checks.$system.$name"
            # lint is a symlinkJoin with no own log; read Clippy itself.
            if [[ "$name" == lint ]]; then
              log=".#legacyPackages.$system.lint.chaz-clippy"
            fi
            echo "::group::$name — replaying stored derivation log; checks are not being rerun"
            if ! nix log "$log"; then
              echo "::warning::Stored log unavailable for $log (local store or configured binary caches); no test result inferred"
            fi
            echo '::endgroup::'
          done
          exit "$build_status"

  # Keep the required PR status `CI` unchanged above. Main adds a second
  # native platform, using the same single zinc listener and persistent store.
  ci-arm:
    name: Main ARM64
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, ARM64, zinc, nix]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No installer or client build-limit overrides: zinc's daemon owns both.
      - name: Checks
        run: |
          nix build --no-link --keep-going \
            .#checks.aarch64-linux.{lint,treefmt,ci-policy,test,build}

  publish:
    name: Publish
    # Matrix E2E is independent and can be disabled without blocking publishing.
    needs: [ci, ci-arm]
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    # Reusable workflows require the names even for environment-scoped secrets;
    # their values are resolved in the callee's protected publishing job.
    secrets:
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
