# Daily release of expired dependency holds: scans open PRs labeled "on-hold",
# parses the hold-until date from the PR body, re-verifies the PR's pinned
# actions, and removes the label once the date is reached. PAT-authored removal
# re-triggers the Hold Gate, which clears its own failing check. Delegates to
# the arcuru/actions reusable workflow.
name: "Deps: Hold Expiry"

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  update-hold:
    if: github.repository_owner == 'arcuru'
    uses: arcuru/actions/.github/workflows/update-hold.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      runs-on: ubicloud-standard-2
      environment: automation
    secrets: inherit
